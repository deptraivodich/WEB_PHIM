services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.1.5101
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: web_phim
      CLICKHOUSE_USER: webphim
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in local environment}
    expose:
      - "8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  fastapi-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/interactions.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_SECONDS: ${SESSION_SECONDS:-28800}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: web_phim
      CLICKHOUSE_USER: webphim
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/data
      - ${GOOGLE_APPLICATION_CREDENTIALS:?Set absolute credentials path}:/run/secrets/firebase.json:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
